[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bloom-api"
version = "0.1.0"
description = "FastAPI backend for the iForeSea bloom-forecasting platform."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic[email]>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
